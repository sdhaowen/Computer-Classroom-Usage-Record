<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 - 计算机教室签到</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-page">
    <div class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>后台管理</h1>
          <p>记录查询、教学内容、教师管理与基础数据维护</p>
        </div>
        <div class="admin-header-actions">
          <button id="logoutBtn" type="button" class="btn-danger">退出登录</button>
          <a class="btn-secondary" href="/">返回学生签到</a>
        </div>
      </header>

      <section class="admin-summary" id="summaryCards"></section>
      <nav class="admin-tabs" id="adminTabs">
        <button type="button" class="admin-tab is-active" data-tab="records">记录查询</button>
        <button type="button" class="admin-tab" data-tab="contents">教学内容</button>
        <button type="button" class="admin-tab" data-tab="teachers">教师管理</button>
        <button type="button" class="admin-tab" data-tab="meta">基础数据</button>
      </nav>

      <section class="admin-tab-panel is-active" data-panel="records">
        <section class="admin-panel">
          <h2>记录筛选</h2>
          <form id="adminFilterForm" class="admin-grid">
            <label>
              学期
              <select id="aSemester"></select>
            </label>
            <label>
              周次
              <select id="aWeek"></select>
            </label>
            <label>
              班级
              <select id="aClassName"></select>
            </label>
            <label>
              学生姓名
              <input id="aStudentName" type="text" placeholder="支持模糊查询" />
            </label>
            <label>
              授课教师
              <input id="aTeacher" type="text" placeholder="例如：王老师" />
            </label>
            <label>
              电脑状态
              <select id="aMachineStatus"></select>
            </label>
            <label>
              开始日期
              <input id="aStartDate" type="date" />
            </label>
            <label>
              结束日期
              <input id="aEndDate" type="date" />
            </label>
            <div class="admin-actions full-row">
              <button type="submit" class="btn-primary">应用筛选</button>
              <button id="clearAdminFilterBtn" type="button" class="btn-secondary">清空筛选</button>
              <button id="exportCsvBtn" type="button" class="btn-secondary">导出 CSV</button>
            </div>
          </form>
        </section>

        <section class="admin-panel">
          <h2>签到记录（最多 1000 条）</h2>
          <div class="table-wrap">
            <table id="adminRecordsTable">
              <thead>
                <tr>
                  <th>学期</th>
                  <th>周次</th>
                  <th>班级</th>
                  <th>学生姓名</th>
                  <th>学习内容</th>
                  <th>电脑状态</th>
                  <th>授课教师</th>
                  <th>时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <p id="adminRecordsMessage" class="message"></p>
        </section>
      </section>

      <section class="admin-tab-panel" data-panel="contents">
        <section class="admin-panel">
          <h2>教学内容管理</h2>
          <div class="admin-split">
            <div class="mini-panel">
              <h3>按学期导入教学内容（每行一条）</h3>
              <label>
                目标学期
                <select id="contentSemester"></select>
              </label>
              <textarea
                id="contentImport"
                rows="10"
                placeholder="3-1-1《寻找信息科技》"
              ></textarea>
              <button id="importContentsBtn" type="button" class="btn-primary">导入教学内容</button>
              <p id="adminContentMessage" class="message"></p>
            </div>
            <div class="mini-panel">
              <h3>当前学期教学内容</h3>
              <ul id="contentList" class="item-list"></ul>
            </div>
          </div>
        </section>
      </section>

      <section class="admin-tab-panel" data-panel="teachers">
        <section class="admin-panel">
          <h2>教师管理</h2>
          <div class="admin-split">
            <div class="mini-panel">
              <h3>导入教师（每行一个姓名）</h3>
              <textarea id="teacherImport" rows="10" placeholder="王老师&#10;李老师"></textarea>
              <button id="importTeachersBtn" type="button" class="btn-primary">导入教师</button>
              <p id="adminTeacherMessage" class="message"></p>
            </div>
            <div class="mini-panel">
              <h3>当前教师列表</h3>
              <ul id="teacherList" class="item-list"></ul>
            </div>
          </div>
        </section>
      </section>

      <section class="admin-tab-panel" data-panel="meta">
        <section class="admin-panel">
          <h2>基础数据维护</h2>
          <div class="admin-split">
            <div class="mini-panel">
              <h3>学期管理</h3>
              <div class="input-row">
                <input id="newSemester" type="text" placeholder="例如：2026-2027第一学期" />
                <button id="addSemesterBtn" type="button" class="btn-primary">新增</button>
              </div>
              <ul id="semesterList" class="item-list"></ul>
            </div>

            <div class="mini-panel">
              <h3>班级管理</h3>
              <div class="input-row">
                <input id="newClassName" type="text" placeholder="例如：六年级一班" />
                <button id="addClassBtn" type="button" class="btn-primary">新增</button>
              </div>
              <ul id="classList" class="item-list"></ul>
            </div>
          </div>
          <p id="adminMetaMessage" class="message"></p>
        </section>
      </section>
    </div>
    <script src="/admin.js"></script>
  </body>
</html>

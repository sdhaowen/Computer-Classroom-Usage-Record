<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>计算机教室签到</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="student-page">
    <div class="student-shell">
      <header class="student-header">
        <h1>计算机教室签到</h1>
        <p>请同学们认真填写，完成后点击“我已签到”</p>
      </header>

      <main class="student-main">
        <section class="panel">
          <h2>学生签到</h2>
          <form id="signForm" class="student-form">
            <label>
              学期
              <select id="semester" required></select>
            </label>
            <label>
              周次
              <select id="week" required></select>
            </label>
            <label>
              班级
              <select id="className" required></select>
            </label>
            <label>
              你的姓名
              <input id="studentName" type="text" maxlength="30" required placeholder="例如：张小明" />
            </label>
            <label class="full-row">
              今天学习内容
              <select id="content" required></select>
            </label>
            <label>
              电脑状态
              <select id="machineStatus" required></select>
            </label>
            <label>
              授课老师
              <select id="teacher" required></select>
            </label>
            <button type="submit" class="btn-primary full-row">我已签到</button>
          </form>
          <p id="signMessage" class="message"></p>
          <p class="helper-link">
            记录查询与数据维护请老师进入 <a href="/admin">后台管理</a>
          </p>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>

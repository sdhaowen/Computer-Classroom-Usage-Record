<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>计算机教室签到</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="student-page">
    <div class="student-shell">
      <header class="student-header">
        <div class="student-badge">快乐上机课</div>
        <h1>计算机教室签到</h1>
        <p>请同学们认真填写，完成后点击“我已签到”</p>
      </header>

      <main class="student-main">
        <section class="panel">
          <h2>学生签到</h2>
          <form id="signForm" class="student-form">
            <label>
              学期
              <select id="semester" required></select>
            </label>
            <label>
              周次
              <select id="week" required></select>
            </label>
            <label>
              班级
              <select id="className" required></select>
            </label>
            <label>
              你的姓名
              <input id="studentName" type="text" maxlength="30" required placeholder="例如：张小明" />
            </label>
            <label class="full-row">
              今天学习内容
              <select id="content" required></select>
            </label>
            <label>
              电脑状态
              <select id="machineStatus" required></select>
            </label>
            <label>
              授课老师
              <select id="teacher" required></select>
            </label>
            <button type="submit" class="btn-primary full-row">我已签到</button>
          </form>
          <p id="signMessage" class="message"></p>
        </section>

        <section class="panel">
          <h2>记录查询</h2>
          <form id="queryForm" class="query-form">
            <label>
              学期
              <select id="qSemester"></select>
            </label>
            <label>
              周次
              <select id="qWeek"></select>
            </label>
            <label>
              班级
              <select id="qClassName"></select>
            </label>
            <label>
              姓名
              <input id="qStudentName" type="text" placeholder="输入姓名关键字" />
            </label>
            <button type="submit" class="btn-secondary">查询</button>
          </form>
          <div class="table-wrap">
            <table id="recordsTable">
              <thead>
                <tr>
                  <th>学期</th>
                  <th>周次</th>
                  <th>班级</th>
                  <th>姓名</th>
                  <th>学习内容</th>
                  <th>电脑状态</th>
                  <th>老师</th>
                  <th>时间</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="panel-actions">
            <button id="refreshRecordsBtn" type="button" class="btn-secondary">刷新记录</button>
          </div>
          <p class="helper-link">
            需要维护数据？请老师进入 <a href="/admin">后台管理</a>
          </p>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
